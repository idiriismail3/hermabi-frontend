<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Hermabi</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/x-icon" href="logo.ico">
<link rel="apple-touch-icon" href="logo.ico">
<style>
.admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
.login-box { background: var(--stucco-dim); padding: 40px; border-radius: 12px; max-width: 400px; margin: 0 auto; border: 1px solid var(--line); }
.login-box h1 { color: var(--brass); text-align: center; margin-bottom: 30px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--stucco); border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
.login-box button { width: 100%; padding: 12px; background: var(--brass); color: var(--ink); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
.admin-panel { display: none; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
.form-group input, .form-group select { width: 100%; padding: 10px; background: var(--stucco); border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
.btn { padding: 12px 24px; background: var(--brass); color: var(--ink); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 10px; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
.product-card { background: var(--stucco-dim); padding: 20px; border-radius: 8px; border: 1px solid var(--line); }
.product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }
.product-card input { width: 100%; padding: 8px; margin-bottom: 10px; background: var(--stucco); border: 1px solid var(--line); border-radius: 4px; color: var(--text); font-size: 12px; }
.product-card button { width: 100%; padding: 8px; background: var(--brass); color: var(--ink); border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 5px; }
.error { color: #ff6b6b; }
.success { color: #51cf66; }
.image-preview { width: 100%; height: 150px; border: 2px solid var(--line); border-radius: 6px; margin-bottom: 15px; object-fit: cover; }
</style>
</head>
<body style="background: var(--stucco); color: var(--text); font-family: 'Poppins', sans-serif;">

<div class="admin-container">

<!-- LOGIN -->
<div id="login-section" class="login-box">
<h1>Hermabi Admin</h1>
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="login-error" class="error" style="margin-top: 10px;"></div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" class="admin-panel">
<h1 style="color: var(--brass); margin-bottom: 30px;">Admin Dashboard</h1>

<!-- ADD PRODUCT FORM -->
<div style="background: var(--stucco-dim); padding: 30px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 40px;">
<h2 style="color: var(--brass); margin-bottom: 20px;">Add New Product</h2>

<div class="form-group">
<label>Product Name *</label>
<input type="text" id="prod-name" placeholder="Black Catalan Shirt">
</div>

<div class="form-group">
<label>Category *</label>
<select id="prod-cat">
<option value="Maillots">Maillots</option>
<option value="Pantalons">Pantalons</option>
<option value="Accessories">Accessories</option>
</select>
</div>

<div class="form-group">
<label>Price (DHS) *</label>
<input type="number" id="prod-price" placeholder="199">
</div>

<div class="form-group">
<label>Stock *</label>
<input type="number" id="prod-stock" placeholder="50">
</div>

<div class="form-group">
<label>Upload Image *</label>
<input type="file" id="prod-image" accept="image/*">
<img id="image-preview" class="image-preview" style="display: none;">
</div>

<button class="btn" onclick="addProduct()">Add Product</button>
<div id="add-msg" style="margin-top: 10px;"></div>
</div>

<!-- PRODUCTS LIST -->
<div>
<h2 style="color: var(--brass); margin-bottom: 20px;">Manage Products</h2>
<div class="products-grid" id="products-grid"></div>
</div>

<button class="btn" onclick="logout()" style="margin-top: 40px;">Logout</button>
</div>

</div>

<script src="js/store.js"></script>
<script>
const PASSWORD = 'hermabi2024';
let selectedImage = '';

// Image upload handler
document.getElementById('prod-image').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(event) {
    selectedImage = event.target.result; // Base64 image
    document.getElementById('image-preview').src = selectedImage;
    document.getElementById('image-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
});

function login() {
  const pass = document.getElementById('password').value;
  if (pass === PASSWORD) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadAllProducts();
  } else {
    document.getElementById('login-error').textContent = 'Wrong password';
  }
}

function logout() {
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('password').value = '';
  document.getElementById('login-error').textContent = '';
}

function addProduct() {
  const name = document.getElementById('prod-name').value;
  const cat = document.getElementById('prod-cat').value;
  const price = parseInt(document.getElementById('prod-price').value);
  const stock = parseInt(document.getElementById('prod-stock').value);
  
  if (!name || !price || !stock || !selectedImage) {
    document.getElementById('add-msg').innerHTML = '<span class="error">Fill all fields & upload image!</span>';
    return;
  }
  
  const products = getProducts();
  const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
  
  products.push({ id: newId, name, cat, price, stock, img: selectedImage });
  saveProducts(products);
  
  // SYNC TO MONGODB
  fetch('https://hermabi-backend-1.onrender.com/api/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ products })
  }).then(() => {
    console.log('✓ Synced to MongoDB');
  }).catch(err => {
    console.error('Sync failed:', err);
  });
  
  document.getElementById('add-msg').innerHTML = '<span class="success">✓ Product added & synced!</span>';
  document.getElementById('prod-name').value = '';
  document.getElementById('prod-price').value = '';
  document.getElementById('prod-stock').value = '';
  document.getElementById('prod-image').value = '';
  document.getElementById('image-preview').style.display = 'none';
  selectedImage = '';
  
  loadAllProducts();
}

function deleteProduct(id) {
  if (confirm('Delete this product?')) {
    const products = getProducts().filter(p => p.id !== id);
    saveProducts(products);
    loadAllProducts();
  }
}

function updateProduct(id) {
  const products = getProducts();
  const product = products.find(p => p.id === id);
  
  product.price = parseInt(document.getElementById(`price-${id}`).value);
  product.stock = parseInt(document.getElementById(`stock-${id}`).value);
  
  saveProducts(products);
  alert('✓ Updated!');
}

function loadAllProducts() {
  const products = getProducts();
  const grid = document.getElementById('products-grid');
  
  if (products.length === 0) {
    grid.innerHTML = '<p style="color: var(--muted);">No products yet</p>';
    return;
  }
  
  grid.innerHTML = products.map(p => `
    <div class="product-card">
    <img src="${p.img}" alt="${p.name}" class="product-img">
    <h3 style="color: var(--cream); margin-bottom: 10px;">${p.name}</h3>
    <p style="color: var(--muted); font-size: 12px;">${p.cat}</p>
    
    <label style="font-size: 11px;">Price</label>
    <input type="number" id="price-${p.id}" value="${p.price}">
    
    <label style="font-size: 11px;">Stock</label>
    <input type="number" id="stock-${p.id}" value="${p.stock}">
    
    <div style="display: flex; gap: 5px; margin-top: 10px;">
    <button class="btn" style="flex: 1; padding: 8px;" onclick="updateProduct(${p.id})">Update</button>
    <button class="btn" style="flex: 1; padding: 8px; background: #9C3B34;" onclick="deleteProduct(${p.id})">Delete</button>
    </div>
    </div>
  `).join('');
}
</script>

</body>
</html>
