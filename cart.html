<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — Hermabi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="motif-strip"></div>
<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand"><img src="images/logo.jpg" alt="Hermabi">HERMABI<small>Modern Moroccan Fashion</small></a>
    <div class="nav-links">
      <a href="shop.html">Boutique</a>
      <a href="shop.html?cat=Maillots">Maillots</a>
      <a href="shop.html?cat=Pantalons">Pantalons</a>
    </div>
    <div class="nav-right">
      <a href="cart.html" class="cart-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </nav>
</header>

<section class="section" style="padding-top:60px;">
  <div class="wrap">
    <h1 style="color: var(--cream); margin-bottom: 40px;">Votre panier</h1>
    
    <div style="display: grid; grid-template-columns: 1fr 350px; gap: 40px;">
      <!-- Cart Items -->
      <div id="cart-items"></div>
      
      <!-- Summary -->
      <div style="background: var(--stucco-dim); padding: 24px; border-radius: 12px; border: 1px solid var(--line); height: fit-content;">
        <h3 style="color: var(--brass); margin-bottom: 20px;">Résumé de commande</h3>
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--muted);">
          <span>Sous-total</span>
          <span id="subtotal">0,00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--muted);">
          <span>Livraison</span>
          <span id="shipping">0,00</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; color: var(--brass); margin-bottom: 30px;">
          <span>Total</span>
          <span id="total">0,00</span>
        </div>
        <a href="checkout.html" class="btn brass" style="display: block; text-align: center; padding: 14px; border-radius: 6px; text-decoration: none; margin-bottom: 12px;">Passer la commande</a>
        <a href="shop.html" style="display: block; text-align: center; color: var(--brass); text-decoration: none; font-size: 14px;">Continuer mes achats</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Hermabi. Tous droits réservés.</span>
      <span>Tetouane, Maroc</span>
    </div>
  </div>
</footer>

<script src="js/store.js"></script>
<script>
function updateCartCount() {
  const count = getCart().length;
  const cartCountEl = document.querySelector('.cart-count');
  if (cartCountEl) {
    cartCountEl.textContent = count;
  }
}

function removeItem(productId, size) {
  removeFromCart(productId, size);
  loadCart();
  updateCartCount();
}

function updateQuantity(productId, size, newQty) {
  if (newQty <= 0) {
    removeItem(productId, size);
    return;
  }
  
  const cart = getCart();
  const item = cart.find(i => i.id === productId && i.size === size);
  if (item) {
    item.qty = newQty;
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    loadCart();
    updateCartCount();
  }
}

function loadCart() {
  const cart = getCart();
  const itemsEl = document.getElementById('cart-items');
  
  if (cart.length === 0) {
    itemsEl.innerHTML = '<p style="color: var(--muted); grid-column: 1 / -1;">Votre panier est vide</p>';
    document.getElementById('subtotal').textContent = '0,00';
    document.getElementById('shipping').textContent = '0,00';
    document.getElementById('total').textContent = '0,00';
    return;
  }
  
  itemsEl.innerHTML = cart.map(item => {
    const product = getProduct(item.id);
    if (!product) return '';
    
    return `
      <div style="background: var(--stucco-dim); padding: 20px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 20px; display: flex; gap: 20px;">
        <img src="${product.img}" alt="${product.name}" style="width: 120px; height: 120px; object-fit: cover; border-radius: 8px;">
        
        <div style="flex: 1;">
          <h3 style="color: var(--cream); margin-bottom: 8px;">${product.name}</h3>
          <p style="color: var(--muted); font-size: 13px; margin-bottom: 12px;">${product.cat}</p>
          
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
            <label style="font-size: 12px; color: var(--muted);">Taille:</label>
            <span style="color: var(--brass);">${item.size || 'M'}</span>
          </div>
          
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
            <label style="font-size: 12px; color: var(--muted);">Qty:</label>
            <input type="number" value="${item.qty}" min="1" max="10" onchange="updateQuantity(${item.id}, '${item.size}', parseInt(this.value))" style="width: 50px; padding: 6px; background: var(--stucco); border: 1px solid var(--line); border-radius: 4px; color: var(--text);">
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: var(--brass); font-weight: 600;">${fmtPrice(product.price * item.qty)}</span>
            <button onclick="removeItem(${item.id}, '${item.size}')" style="padding: 6px 12px; background: #9C3B34; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Supprimer</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
  
  // Update totals
  document.getElementById('subtotal').textContent = fmtPrice(cartSubtotal());
  document.getElementById('shipping').textContent = fmtPrice(shippingCost());
  document.getElementById('total').textContent = fmtPrice(cartTotal());
}

// Load on page load
window.addEventListener('load', () => {
  loadCart();
  updateCartCount();
});
</script>

</body>
</html>
